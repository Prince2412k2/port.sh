# Two ways in, one program:
#
#   ssh -p 2222 <your-host>     the terminal-native version
#   http://<your-host>:8222     the same thing in a browser
#
#   docker compose up -d --build
#
# No username needed for ssh -- the binary speaks SSH itself, so there is no
# OS account for one to name. Published on 2222 rather than 22 so this never
# has to fight whatever the host's own sshd is doing; move it later by
# changing the left side of the port mapping.
#
# Two services from one image. They are separate containers on purpose: a
# crash or a restart on one transport does not take the other down with it,
# and each gets its own resource ceiling rather than sharing one.

services:
  portfolio:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["--serve", "--ssh-addr", "0.0.0.0", "--ssh-port", "2222",
              "--host-key", "/app/keys/host_key"]
    ports:
      # Straight at the internet, because there is no proxying an ssh session
      # through a web server. `SSH_BIND` is here for a box that already has
      # something on 2222.
      - "${SSH_BIND:-0.0.0.0:2222}:2222"

      # mosh. One udp port per live session, published one-to-one because the
      # port a session lands on is the port mosh-server names to the client --
      # remapped, the client would be told to talk to a port that is not there.
      # The width of this range is the cap on concurrent mosh sessions; keep it
      # in step with `MOSH_PORTS` in portfolio/src/net.rs.
      - "60000-60010:60000-60010/udp"

    volumes:
      # The host key, generated on first run. Keep this volume: it is what
      # stops every returning visitor seeing a changed-fingerprint warning.
      - hostkey:/app/keys

      # The basemap and the terrain. Large, rebuildable, and deliberately not
      # in the image; without them the map section says so rather than drawing
      # the wrong city.
      #
      # The basemap is bound straight from a real file rather than through the
      # symlink that used to sit at map/data/india.pmtiles. A bind source is
      # resolved by the daemon, so when that symlink's target went away Docker
      # tried to *create* the path and the whole stack refused to start:
      # `mkdir ...india.pmtiles: file exists`. A real file cannot fail that way.
      #
      # Overridable because the archive is 1.7 GB and a box that already has
      # one for something else should not be made to keep two. Point `PMTILES`
      # at wherever it lives; the default is the checkout, for working locally.
      - ${PMTILES:-./map-data/vector.pmtiles}:/app/data/india.pmtiles:ro
      - ./map/data/india.tmhg:/app/data/india.tmhg:ro
      - ./map/data/states.tmap:/app/data/states.tmap:ro

      # Text is baked into the image but read from disk first, so mounting a
      # file here edits the running site. Restart the container to pick it up;
      # nothing is compiled in.
      - ./portfolio/data/about.txt:/app/data/about.txt:ro
      - ./portfolio/data/taste.txt:/app/data/taste.txt:ro
      - ./map/data/places.txt:/app/data/places.txt:ro
      # The agent's model list. Mounted so the order can change, or a model
      # that has stopped being free can go, without a rebuild.
      - ./portfolio/data/models.txt:/app/data/models.txt:ro
      # Our own agent's model catalogue -- endpoints, context windows and which
      # credential each of its tiers uses. Mounted for the same reason, and
      # deliberately the only place those live: models.txt says which tiers to
      # try and in what order, this says what a model actually is.
      - ./ai-sdk/envoy.json:/app/data/envoy.json:ro

      # Where `/reach` appends. The only thing the process writes that anyone
      # wants to keep, and the only writable path outside the tmpfs below.
      - messages:/app/messages

      # Envoy's Codex credential store, shared by the web and SSH services.
      - agent:/app/agent
      - ~/.codex/auth.json:/app/agent/codex/auth.json

    # Envoy's scratch space is ephemeral.
    #
    # The agents' *cache* is deliberately not here: XDG_CACHE_HOME points at the
    # volume instead. Copilot unpacks 209 MB of itself into it on first run,
    # which 64m cannot hold, and then has to map a native addon out of it, which
    # a noexec tmpfs will not allow. Raising the size fixes neither. See
    # deploy/Dockerfile.
    tmpfs:
      - /tmp:size=64m,mode=1777

    environment:
      # Where termap looks for all of the above.
      TERMAP_DATA: /app/data

      # Ollama's credential. Keep it in a .env file beside this one -- compose
      # picks that up on its own,
      # and it is not a file to commit.
      #
      # With no key the ask section reports that the agent would not start and
      # every other section carries on. That is deliberate: a missing key
      # should cost one tab, not the site.
      # The ollama-cloud tier. A key from ollama.com, which talks to
      # https://ollama.com/v1 directly -- there is no ollama daemon in
      # this image for the local provider to reach.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # The web tools -- `search_web` and `fetch_page`. These two are spent by
      # the portfolio itself rather than by an agent: no tier declares them, so
      # `spawn_command` strips them from every agent's environment. Without
      # them the two tools are not offered at all, and the section carries on
      # with whatever web tools the agent brings of its own.
      #
      # A search costs money, so the ceiling is compiled in --
      # `gates.rs: web_calls` per conversation, and `--probe` prints it.
      EXA_API_KEY: ${EXA_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # The visitor's own address is geolocated to put a marker on the map.
      # Set this to anything to turn that off.
      # TERMAP_NO_CLIENT_LOOKUP: "1"
      # How long an idle session is kept open. 0 disables the timeout.
      # PORTFOLIO_IDLE_SECS: "900"
      # PORTFOLIO_MAX_SESSION_SECS: "3600"
      # PORTFOLIO_DAILY_AI_USD: "10"
      # PORTFOLIO_AI_REQUEST_USD: "0.25"
      # PORTFOLIO_DAILY_VISITS: "24"

    # A stranger's session should not be able to take the box down. Sized for
    # a handful of concurrent visitors on a small VPS; the map holds 96 tiles
    # and a heightmap, which is where most of the memory goes. `cpus`/
    # `mem_limit` rather than `deploy.resources.limits`: the `deploy` key is a
    # Swarm construct and this Compose version reconciles it against
    # `pids_limit` at the top level, refusing to start when the two disagree.
    cpus: 3
    mem_limit: 9G
    pids_limit: 512

    # No writable filesystem at all, and no added capabilities. There used to
    # be both -- sshd needed a privilege-separation directory and a handful of
    # capabilities to bind low ports and drop to a session user. None of that
    # exists any more: the process runs as one already-unprivileged user for
    # its whole life and writes nothing but the host key, which lives on its
    # own volume above.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # The portfolio prints plain text when there is no terminal, which makes
      # it its own health check.
      test: ["CMD", "/usr/local/bin/portfolio", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # The same binary and the same image, serving the same sessions to a
  # browser instead of an SSH client. No pty, no subprocess, no shell -- the
  # far end of that WebSocket is the identical `Shell` the SSH path drives.
  portfolio-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["--web", "--web-addr", "0.0.0.0", "--web-port", "8222"]
    ports:
      # Loopback by default: this speaks plain HTTP, so the only thing that
      # should be able to reach it is the thing terminating TLS in front of it.
      # Published on 0.0.0.0 it is a way around that proxy, and the page tells
      # a browser to open `ws://` rather than `wss://` when it is reached that
      # way, which is a downgrade nobody asked for.
      #
      # A proxy that runs in Docker rather than on the host does not need this
      # published at all -- put both on one network and point it at `web:8222`.
      - "${WEB_BIND:-127.0.0.1:8222}:8222"

    volumes:
      # No host key here: nothing on this path is authenticated, so there is
      # nothing to persist between restarts.
      - ${PMTILES:-./map-data/vector.pmtiles}:/app/data/india.pmtiles:ro
      - ./map/data/india.tmhg:/app/data/india.tmhg:ro
      - ./map/data/states.tmap:/app/data/states.tmap:ro
      - ./portfolio/data/about.txt:/app/data/about.txt:ro
      - ./portfolio/data/taste.txt:/app/data/taste.txt:ro
      - ./map/data/places.txt:/app/data/places.txt:ro
      - ./portfolio/data/models.txt:/app/data/models.txt:ro
      - ./ai-sdk/envoy.json:/app/data/envoy.json:ro
      # The same volumes as the ssh service: it should not matter which way in
      # somebody came to leave a message, and the agent logs in once.
      - messages:/app/messages
      - agent:/app/agent
      - ~/.codex/auth.json:/app/agent/codex/auth.json

    # Envoy's scratch space is ephemeral.
    tmpfs:
      - /tmp:size=64m,mode=1777

    environment:
      TERMAP_DATA: /app/data

      # Ollama's credential. Keep it in a .env file beside this one -- compose
      # picks that up on its own,
      # and it is not a file to commit.
      #
      # With no key the ask section reports that the agent would not start and
      # every other section carries on. That is deliberate: a missing key
      # should cost one tab, not the site.
      # The ollama-cloud tier. A key from ollama.com, which talks to
      # https://ollama.com/v1 directly -- there is no ollama daemon in
      # this image for the local provider to reach.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # The web tools -- `search_web` and `fetch_page`. These two are spent by
      # the portfolio itself rather than by an agent: no tier declares them, so
      # `spawn_command` strips them from every agent's environment. Without
      # them the two tools are not offered at all, and the section carries on
      # with whatever web tools the agent brings of its own.
      #
      # A search costs money, so the ceiling is compiled in --
      # `gates.rs: web_calls` per conversation, and `--probe` prints it.
      EXA_API_KEY: ${EXA_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # A browser tab left open in the background answers everything and would
      # otherwise hold its session indefinitely.
      # PORTFOLIO_IDLE_SECS: "900"
      # PORTFOLIO_MAX_SESSION_SECS: "3600"
      # PORTFOLIO_DAILY_AI_USD: "10"
      # PORTFOLIO_AI_REQUEST_USD: "0.25"
      # PORTFOLIO_DAILY_VISITS: "24"

    cpus: 1.5
    mem_limit: 1G
    pids_limit: 256

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "/usr/local/bin/portfolio", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  hostkey:
  # Messages left through `/reach`, one JSON document per line. Read them:
  #   docker compose exec portfolio cat /app/messages/messages.jsonl
  messages:
  # Envoy credentials. Keep this volume: losing it means logging Codex back in.
  agent:
