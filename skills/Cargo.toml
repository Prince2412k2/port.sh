[package]
name = "skysheet"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = ["termap/native", "ratatui/crossterm", "dep:crossterm"]
browser-core = ["termap/browser-core"]

[dependencies]
termap = { path = "../map", default-features = false }
ratatui = { version = "0.30.1", default-features = false }
crossterm = { version = "0.29.0", optional = true }
serde = { version = "1", features = ["derive"] }
