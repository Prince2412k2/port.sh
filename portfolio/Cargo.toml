[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30.1"
crossterm = "0.29.0"
termap = { path = "../map" }
skysheet = { path = "../skills" }

# For `--serve`: an in-process SSH server, so a login can be any username (or
# none at all) rather than one of OpenSSH's system accounts. Same crate and
# pinned version as harbr's SSH layer, which solves this exact problem.
russh = "0.62"
rand = "0.10"
anyhow = "1"
bytes = "1"
futures-util = "0.3"
# Pinned exactly: 0.8.9 wants tokio-tungstenite 0.29, which is not in the
# offline registry. 0.8.4 resolves against what is cached.
axum = { version = "=0.8.4", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
