[package]
name = "portfolio-v2-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portfolio-v2-client-core = { path = "../client-core" }
portfolio-v2-protocol = { path = "../protocol" }
portfolio-v2-scene = { path = "../scene" }
termap = { path = "../../../map", default-features = false, features = ["browser-core"] }
serde_json.workspace = true
wasm-bindgen = "=0.2.127"
console_error_panic_hook = "0.1"
ciborium = "0.2"
