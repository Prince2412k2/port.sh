[package]
name = "portfolio-v2-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portfolio-v2-client-core = { path = "../client-core" }
portfolio-v2-protocol = { path = "../protocol" }
termap = { path = "../../../map", default-features = false, features = ["browser-core"] }
serde_json.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Document", "Element", "Event", "EventTarget", "Headers", "HtmlElement", "KeyboardEvent", "MediaQueryList", "MouseEvent", "PointerEvent", "Response", "WheelEvent", "Window"]
