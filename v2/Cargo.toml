[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/assets",
  "crates/scene",
  "crates/client-core",
  "crates/native",
  "crates/browser",
  "crates/backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
