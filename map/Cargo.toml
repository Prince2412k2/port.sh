[package]
name = "termap"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = ["dep:ratatui", "ratatui/crossterm", "dep:crossterm", "dep:flate2", "dep:memmap2"]
browser-core = ["dep:ratatui"]

[dependencies]
ratatui = { version = "0.30.1", optional = true, default-features = false }
crossterm = { version = "0.29.0", optional = true }
flate2 = { version = "1.1", optional = true }
memmap2 = { version = "=0.9.11", optional = true }
