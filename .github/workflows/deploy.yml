# Push to main, and the box that serves this builds it and swaps itself over.
#
# Nothing is compiled here. GitHub's part is to hold the key and say when --
# the build happens on the server, in Docker, against the caches in
# deploy/Dockerfile. That keeps the one thing that matters true for free: the
# binary is linked on bookworm because it is linked *in* the bookworm image it
# will run in. A runner is two Ubuntu releases ahead of that, and a binary
# built against a newer glibc than its runtime does not start -- which is the
# sort of thing that is discovered in production and nowhere else.
#
# The cost is that the server compiles. It is bounded: the registry and both
# target directories are BuildKit caches, so a push that changes one file
# rebuilds one crate, and a push that changes nothing rebuilds nothing.

name: deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit to hang it on.
  workflow_dispatch:

# One at a time, and never cancelled half way. Two of these racing would have
# two `git reset --hard` and two `docker compose up` interleaving in the same
# directory, and the loser decides what is running.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Where the checkout is. Not a secret -- a path is not one, and keeping it
  # here means the workflow can be read without opening the settings page.
  DEPLOY_PATH: /opt/port.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `actions/checkout`: this job never reads the source. It opens one ssh
    # connection and the far end does the rest.
    steps:
      - name: Build and swap over, on the box
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          # Optional, and the only one of these that is about trust rather
          # than address. See below.
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Named, so a missing one is a sentence rather than `ssh: Could not
          # resolve hostname : Name or service not known` three lines later.
          missing=
          for v in HOST PORT USER SSH_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "secret $v is not set" >&2
              missing=yes
            fi
          done
          if [ -n "$missing" ]; then
            echo "see 'On push to main' in deploy/README.md" >&2
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          # Who the box is allowed to be.
          #
          # With `KNOWN_HOSTS` set this is a pin: the runner talks to that host
          # key and no other. Without it there is nothing to compare against,
          # so the alternative is asking the address who it is and believing
          # the answer -- which is not a check, and is said out loud here
          # rather than hidden behind `StrictHostKeyChecking=no`.
          #
          # It matters less than it looks: ssh public-key auth signs a
          # challenge for the session it is in, so an impostor cannot replay it
          # against the real box or learn the key from it. What it would get is
          # this command, and your deploy not happening. One secret closes it.
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "note: KNOWN_HOSTS is not set, so the box's identity is not" >&2
            echo "      checked -- see deploy/README.md to pin it" >&2
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "no host key for $HOST port $PORT -- is the box reachable?" >&2
            exit 1
          fi

          # `PORT` is the box's own sshd, and has no default on purpose: 22 is
          # where this app's ssh server is once it is deployed, so a fallback
          # would have pointed the deploy at the portfolio rather than at the
          # machine. It refuses the command and the job fails, which is the
          # right outcome reached by an unreadable route.
          #
          # BatchMode so nothing can stop and wait for an answer nobody is
          # there to give, and a timeout so an unreachable box costs a minute
          # rather than the job's whole budget.
          ssh -i ~/.ssh/deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -p "$PORT" \
              "$USER@$HOST" \
              "DEPLOY_PATH='${{ env.DEPLOY_PATH }}' SHA='${{ github.sha }}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH" || {
            echo "no checkout at $DEPLOY_PATH -- the first one is by hand," >&2
            echo "see 'Putting it on the internet' in deploy/README.md" >&2
            exit 1
          }

          # Fetch then reset, rather than pull: the checkout on a server is a
          # mirror of main and not somewhere work happens, and a merge conflict
          # there is a deploy that hangs waiting for an editor nobody is at.
          #
          # Deliberately no `git clean`: .env, docker-compose.override.yml and
          # anything else untracked on that box is configuration, and reset
          # leaves it alone where clean would take the credentials with it.
          git fetch --prune origin main
          git reset --hard "$SHA"

          # Both files, named rather than inherited. The prod overlay is what
          # puts ssh on 22 and the web on the proxy's network, and a deploy
          # that quietly left it out would come up on the dev ports and look
          # like it had worked.
          compose='docker compose -f docker-compose.yml -f docker-compose.prod.yml'

          # The old containers keep serving until this succeeds. A build that
          # fails leaves the site exactly as it was, which is the reason the
          # build comes before the swap and not after it.
          $compose up -d --build

          # And say so only once it is answering, because "compose returned 0"
          # and "the site is up" are different claims.
          for i in $(seq 1 30); do
            if $compose exec -T portfolio-web /usr/local/bin/portfolio --health >/dev/null 2>&1; then
              echo "up: $(git rev-parse --short HEAD)"
              exit 0
            fi
            sleep 2
          done

          echo "built and started, but it never answered --health" >&2
          $compose ps >&2
          $compose logs --tail=40 >&2
          exit 1
          REMOTE
